name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # upload release assets

jobs:
  test: # macOS, Linux and Windows must all pass before anything is released
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      id-token: write # sign the build provenance (Sigstore)
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser builds the changelog from history

      - name: Release only from main # stage is the dev branch; Homebrew and installers follow main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Private half of a deploy key with write access to Alineteam-Inc/homebrew-tap only.
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      # Signed proof that each archive was built here from this tag's source; users check it with
      # gh attestation verify <archive> -R Alineteam-Inc/GitFolio (README).
      - uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
