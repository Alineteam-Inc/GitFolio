name: ci

# GitFolio runs on macOS, Linux and Windows, so every change is tested on all three.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml runs this first

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        shell: bash # also on Windows (Git Bash), so the per-test lines look the same everywhere
        run: go test -v ./... | grep -E '^(--- (PASS|FAIL|SKIP)|ok|FAIL|panic)'

      # The install scripts, fed a local release-like folder: they must install the right archive
      # after checking its SHA-256, and refuse a tampered one.
      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          os=$(go env GOOS) arch=$(go env GOARCH) d=$RUNNER_TEMP/rel; mkdir -p $d
          go build -o gitfolio ./cmd/gitfolio && tar -czf $d/gitfolio_${os}_${arch}.tar.gz gitfolio
          (cd $d && shasum -a 256 *.tar.gz > checksums.txt)
          GITFOLIO_BASE_URL=file://$d GITFOLIO_INSTALL_DIR=$RUNNER_TEMP/bin sh install.sh
          $RUNNER_TEMP/bin/gitfolio version | tail -2
          echo tampered >> $d/gitfolio_${os}_${arch}.tar.gz
          if GITFOLIO_BASE_URL=file://$d GITFOLIO_INSTALL_DIR=$RUNNER_TEMP/bin2 sh install.sh; then echo "tampered archive was installed"; exit 1; fi

      - name: install.ps1 (Windows PowerShell 5.1 and PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'rel'; New-Item -ItemType Directory $d | Out-Null
          go build -o gitfolio.exe ./cmd/gitfolio
          Compress-Archive gitfolio.exe (Join-Path $d 'gitfolio_windows_amd64.zip')
          $h = (Get-FileHash (Join-Path $d 'gitfolio_windows_amd64.zip') -Algorithm SHA256).Hash.ToLower()
          "$h  gitfolio_windows_amd64.zip" | Set-Content (Join-Path $d 'checksums.txt')
          $env:GITFOLIO_BASE_URL = ([Uri]$d).AbsoluteUri
          foreach ($ps in 'powershell', 'pwsh') {
            $env:GITFOLIO_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "bin-$ps"
            & $ps -NoProfile -ExecutionPolicy Bypass -File install.ps1
            if ($LASTEXITCODE) { throw "install.ps1 failed under $ps" }
            & (Join-Path $env:GITFOLIO_INSTALL_DIR 'gitfolio.exe') version | Select-Object -Last 2
          }
          Add-Content (Join-Path $d 'gitfolio_windows_amd64.zip') 'tampered'
          $env:GITFOLIO_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin-tampered'
          & pwsh -NoProfile -File install.ps1
          if (-not $LASTEXITCODE) { throw 'tampered archive was installed' }
          if (Test-Path (Join-Path $env:GITFOLIO_INSTALL_DIR 'gitfolio.exe')) { throw 'tampered archive was installed' }
