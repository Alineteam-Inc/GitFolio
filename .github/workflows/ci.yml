name: ci

# GitFolio runs on macOS, Linux and Windows, so every change is tested on all three.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml runs this first

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        shell: bash # also on Windows (Git Bash), so the per-test lines look the same everywhere
        run: go test -v ./... | grep -E '^(--- (PASS|FAIL|SKIP)|ok|FAIL|panic)'
